<title>Carta · Boró Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Italiana&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --paper:#f4e8d0; --paper-deep:#eddfc2; --paper-soft:#faf3e6;
  --ink:#3b3026; --ink-soft:#6d5b48; --ink-faint:#94806a;
  --line:#d9c7a7; --line-soft:#e6d8bd;
  /* Verde de la silla del local, medido en el canto iluminado del asiento: #7a8160. Los bloques van
     al 90 % de ese tono, lo más claro que admite texto legible encima (4.6:1 con el crema casi blanco);
     el tono puro no llega ni a 4.1:1 ni con blanco puro. Precios y títulos sobre papel, al 70 %. */
  --marca:#565b45; --olive:#7a8160; --gold:#bb8a33;
  --pie:#6e7456; --pie-tinta:#fdf8ec; --pie-suave:#fdf8ec; --pie-linea:rgba(253,248,236,.48);
  --display:"Italiana",Georgia,serif;
  --titulo:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-weight:400; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
.hoja{max-width:620px; margin:0 auto; background:var(--paper)}
.wrap{padding-inline:22px}
img{display:block; max-width:100%; height:auto}
a{color:inherit}

/* ---------- portada ---------- */
.portada{
  position:relative; background:var(--pie); color:var(--pie-tinta);
  padding-block:66px 58px; text-align:center;
}
.portada::after{  /* filete interior, como el marco de una carta impresa */
  content:""; position:absolute; inset:13px; border:1px solid var(--pie-linea); pointer-events:none;
}
.portada-inner{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:24px; padding-inline:30px;
}
.portada .kicker{
  margin:0; font-size:11px; letter-spacing:.36em; text-transform:uppercase;
  color:var(--pie-tinta); font-weight:400;
}
.portada h1.logo{margin:0; width:min(62%,212px); font-size:0; line-height:0}
.portada h1.logo img{width:100%; height:auto}
.portada .bajada{
  margin:0; max-width:26ch; font-size:13px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--pie-tinta); font-weight:400; line-height:1.75;
}
.portada .filete-portada{width:44px; height:1px; background:var(--pie-linea)}

/* ---------- navegación ---------- */
.nav{
  position:sticky; top:0; z-index:10; background:var(--paper);
  border-bottom:1px solid var(--line-soft);
}
.nav-inner{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px 16px}
.nav a{
  text-align:center; text-decoration:none; font-size:13px; font-weight:400;
  letter-spacing:.06em; padding:7px 4px; border:1px solid var(--line);
  border-radius:999px; color:var(--ink-soft); white-space:nowrap;
  transition:background-color .15s,color .15s,border-color .15s;
}
.nav a.is-active{background:var(--pie); border-color:var(--pie); color:var(--paper-soft)}
.nav a:focus-visible{outline:2px solid var(--marca); outline-offset:2px}

/* ---------- grupos ---------- */
.grupo{padding-block:44px 6px; scroll-margin-top:58px}
.grupo-cab{text-align:center}
.grupo h2{
  margin:0; font-family:var(--titulo); font-weight:600; font-size:34px;
  line-height:1.1; letter-spacing:.01em; text-wrap:balance;
}
.filete{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-top:12px; color:var(--line);
}
.filete::before,.filete::after{content:""; height:1px; width:34px; background:currentColor}
.filete span{font-size:7px; color:var(--marca)}
.nota{font-family:var(--titulo); font-style:italic; font-size:16px; color:var(--ink-soft)}
.grupo-cab .nota{margin:12px auto 0; max-width:40ch}
.grupo-cab .fijo{margin:14px 0 0}
.sub .nota{margin:-8px 0 16px}
.sub{padding-top:30px; scroll-margin-top:58px}
.sub h3{
  display:flex; align-items:center; gap:12px; margin:0 0 18px;
  font-size:11.5px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--marca);
}
.sub h3::after{content:""; flex:1; height:1px; background:var(--line-soft)}
.fijo{
  display:inline-block; margin:-6px 0 18px; padding:4px 12px;
  border:1px solid var(--marca); border-radius:999px;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--marca); font-variant-numeric:tabular-nums;
}

.promos{display:flex; flex-direction:column; gap:14px; margin-top:-4px}
.promo{background:var(--paper-deep); border-radius:3px; padding:16px 18px}
.promo-cab{display:flex; align-items:baseline; gap:12px; margin:0}
.promo-nombre{font-family:var(--titulo); font-size:22px; font-weight:600; line-height:1.15}
.promo-precio{margin-left:auto; font-size:19px; font-weight:500; color:var(--marca); font-variant-numeric:tabular-nums}
.promo-detalle{margin:9px 0 0; font-size:14px; font-weight:300; color:var(--ink-soft); line-height:1.5}

.items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:19px}
.item-top{display:flex; align-items:baseline; gap:9px}
.item-nombre{margin:0; font-size:16px; font-weight:500; letter-spacing:.005em; flex:0 1 auto}
.dots{flex:1 1 auto; min-width:14px; height:0; border-bottom:1px dotted var(--line); transform:translateY(-4px)}
.precio{flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:16px; text-align:right}
.tamanos{list-style:none; margin:7px 0 0; padding:0; display:flex; flex-direction:column; gap:7px}
.tamanos li{display:flex; align-items:baseline; gap:9px}
.tam-nombre{font-family:var(--titulo); font-style:italic; font-size:16px; color:var(--ink-soft); flex:0 1 auto}
.tamanos .precio{font-size:15px}
.item-desc{margin:5px 0 0; font-size:14px; font-weight:300; color:var(--ink-soft); max-width:52ch; line-height:1.45}
.variantes{
  margin:6px 0 0; font-family:var(--titulo); font-size:16px; font-style:italic;
  color:var(--ink-soft); line-height:1.4;
}
.tag{
  display:inline-block; margin-left:8px; font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--olive); border:1px solid currentColor;
  padding:2px 6px; border-radius:2px; vertical-align:2px; font-weight:400;
}
.item.destacado .item-nombre{color:var(--marca)}
.item.agotado{opacity:.45}
.item.agotado .precio{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint)}

/* ---------- pie ---------- */
.pie{margin-top:48px; background:var(--pie); color:var(--pie-tinta); padding-block:46px 40px; text-align:center}
.pie-inner{display:flex; flex-direction:column; align-items:center; gap:24px; padding-inline:22px}
.pie-logo{width:132px; height:auto}
.pie-datos{display:flex; flex-direction:column; align-items:center; gap:14px; font-size:14.5px; font-weight:400; letter-spacing:.02em; line-height:1.5}
.pie a{color:inherit; text-decoration:none}
.pie a:focus-visible{outline:2px solid var(--pie-tinta); outline-offset:4px; border-radius:2px}
.pie-dir{border-bottom:1px solid var(--pie-linea); padding-bottom:2px}
.pie-ig{display:inline-flex; align-items:center; gap:9px}
.pie-ig svg{flex:none}
.pie-ig span{border-bottom:1px solid var(--pie-linea); padding-bottom:2px}
.pie-dir:hover, .pie-ig:hover span{border-bottom-color:currentColor}
.horario{display:flex; flex-direction:column; gap:5px; margin:0}
.horario div{display:flex; justify-content:center; gap:10px; font-size:14px; font-weight:400}
.horario dt{color:var(--pie-suave)}
.horario dd{margin:0; font-variant-numeric:tabular-nums}
.pie-filete{width:40px; height:1px; background:var(--pie-linea)}
.sello{margin:0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--pie-suave); font-weight:400}

@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<div class="hoja">
<header class="portada"><div class="portada-inner">
<p class="kicker">Carta</p>
<h1 class="logo"><img src="assets/logo-claro.webp" width="400" height="400" alt="Boró Café · Pan · Café de especialidad · Bollería"></h1>
<div class="filete-portada" aria-hidden="true"></div>
<p class="bajada">Café de especialidad<br>Pan de masa madre</p>
</div></header>
<!-- NAV -->
<!-- CARTA -->
<footer class="pie"><div class="pie-inner">
<img class="pie-logo" src="assets/logo-claro.webp" width="400" height="400" alt="Boró Café" loading="lazy">
<div class="pie-datos">
<a class="pie-dir" href="https://www.google.com/maps/search/?api=1&amp;query=Av.%20Los%20Leones%202299%2C%20Providencia">Los Leones esq Tranquila<br>Providencia</a>
<a class="pie-ig" href="https://www.instagram.com/borocafe.cl/" aria-label="Instagram de Boró Café, @borocafe.cl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg><span>@borocafe.cl</span></a>
</div>
<div class="pie-filete" aria-hidden="true"></div>
<p class="sello">Carta vigente · <!-- MES --></p>
</div></footer>
</div>
<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav a'));
  var secs  = links.map(function(a){ return document.querySelector(a.getAttribute('href')); });
  var nav = document.querySelector('.nav');
  if(!links.length || !nav) return;
  var pedido = false;

  function marcar(){
    pedido = false;
    var limite = nav.getBoundingClientRect().height + 8;
    var activo = -1;
    for(var i = 0; i < secs.length; i++){
      if(secs[i] && secs[i].getBoundingClientRect().top <= limite) activo = i;
    }
    // Al final de la página gana siempre el último grupo, aunque su título ya haya pasado.
    if(window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) activo = secs.length - 1;
    for(var j = 0; j < links.length; j++) links[j].classList.toggle('is-active', j === activo);
    var chip = links[activo], caja = nav.firstElementChild;
    if(chip && caja && caja.scrollWidth > caja.clientWidth){
      caja.scrollTo({left: chip.offsetLeft - caja.clientWidth/2 + chip.clientWidth/2, behavior:'smooth'});
    }
  }

  function pedir(){ if(!pedido){ pedido = true; requestAnimationFrame(marcar); } }
  addEventListener('scroll', pedir, {passive:true});
  addEventListener('resize', pedir);
  addEventListener('hashchange', pedir);
  addEventListener('load', pedir);
  marcar();
})();
</script>
